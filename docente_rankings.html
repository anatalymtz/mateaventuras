function cota(x1,y1,x2,y2,t,o){o=o||{};const off=o.off==null?14:o.off,col=o.c||'#9a3412',halo=o.h||'#fff';
 const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
 const ax=x1+nx*off,ay=y1+ny*off,bx=x2+nx*off,by=y2+ny*off;const sg=off>=0?1:-1;const lab=o.lab==null?13*sg:o.lab;
 const lx=(ax+bx)/2+nx*lab,ly=(ay+by)/2+ny*lab;
 const ar=(px,py,sx,sy)=>`<polygon points="${r1(px)},${r1(py)} ${r1(px+sx*8+nx*3.5)},${r1(py+sy*8+ny*3.5)} ${r1(px+sx*8-nx*3.5)},${r1(py+sy*8-ny*3.5)}" fill="${col}"/>`;
 let s='';
 if(off!==0)s+=`<line x1="${x1}" y1="${y1}" x2="${r1(ax+nx*sg*4)}" y2="${r1(ay+ny*sg*4)}" stroke="${col}" stroke-width="1" opacity=".55"/><line x1="${x2}" y1="${y2}" x2="${r1(bx+nx*sg*4)}" y2="${r1(by+ny*sg*4)}" stroke="${col}" stroke-width="1" opacity=".55"/>`;
 s+=`<line x1="${r1(ax)}" y1="${r1(ay)}" x2="${r1(bx)}" y2="${r1(by)}" stroke="${col}" stroke-width="1.7" ${o.dash?'stroke-dasharray="5 4"':''}/>`+(o.noArrow?'':ar(ax,ay,ux,uy)+ar(bx,by,-ux,-uy));
 s+=`<text x="${r1(lx)}" y="${r1(ly)}" class="cota-txt ${o.dato?'dato':''}" fill="${col}" stroke="${halo}">${t}</text>`;
 return `<g>${s}</g>`;}
const NOCHE={c:'#fde68a',h:'#0b1d3a'};
function cn(x1,y1,x2,y2,t,o){return cota(x1,y1,x2,y2,t,Object.assign({},NOCHE,o||{}));}

function progresoDias(r){return [0,1,2,3].map(i=>{const d=r.dias[i];if(d&&d.c)return `<span class="punto ${d.primer?'p-star':'p-ok'}" title="Día ${i+1}: ${d.intentos} intento(s)">${d.primer?'★':'✓'}</span>`;if(r.estado!=='finalizado'&&r.fase==='mision'&&(r.diaActual===i))return `<span class="punto p-act" title="Día ${i+1} en curso">${i+1}</span>`;return `<span class="punto p-no">${i+1}</span>`;}).join('');}
function cotejoDe(id){return DOC.cot[id]||[false,false,false,false];}
function calif(id){return cotejoDe(id).filter(Boolean).length*2.5;}

function renderDocente(){document.body.className='atm-3';const L=alumnosTodos();
 const totE=L.reduce((a,r)=>a+(+r.energia||0),0),meta=Math.max(1,L.length)*90,pct=Math.min(100,Math.round(totE/meta*100));
 const fin=L.filter(r=>r.estado==='finalizado').length;
 $('#app').innerHTML=`<header class="cielo"><div class="deco deco-noche"><div class="bengala"></div></div><div class="wrap relative py-5">
  <div class="flex flex-wrap items-center justify-between gap-3"><div><div class="text-xs font-extrabold uppercase tracking-widest opacity-80">Panel docente</div><h1 class="text-3xl font-extrabold">🗼 Isla Polígono · Centro de Mando</h1></div>
  <div class="flex flex-wrap gap-2"><span class="chip">👥 ${L.length} alumnos</span><span class="chip">🏁 ${fin} finalizados</span><span class="chip" title="Estado de conexión">${FB?(DOC.estadoFb||'☁️ Firebase…'):'💾 Solo este dispositivo'}</span><button class="btn btn-prim btn-mini" onclick="ISLA.proyectar(true)">📽️ Modo Proyección</button></div></div>
  <div class="mt-4"><div class="flex justify-between text-xs font-extrabold mb-1"><span>📡 Señal de Rescate Cooperativa del grupo</span><span>${pct}% · ${totE} ⚡ de ${meta}</span></div><div class="barra"><i style="width:${pct}%"></i></div></div></div></header>
 <main class="wrap py-5"><div class="flex flex-wrap gap-1">${[['ranking','🏆 Rankings'],['cotejo','✅ Lista de cotejo'],['auto','📝 Autoevaluaciones'],['config','⚙️ Conexión y exportación']].map(t=>`<button class="pestana ${DOC.tab===t[0]?'act':''}" onclick="ISLA.tab('${t[0]}')">${t[1]}</button>`).join('')}</div>
 <div class="bitacora p-4 sm:p-5" style="border-top-left-radius:0">${DOC.tab==='ranking'?vRanking(L):DOC.tab==='cotejo'?vCotejo(L):DOC.tab==='auto'?vAutoDoc(L):vConfig()}</div></main>
 ${DOC.proy?vProyeccion(L,pct,totE,meta):''}`;}
function vacio(){return `<div class="text-center py-10 font-bold opacity-60">Aún no hay expedicionarios registrados.<br><span class="text-sm">Comparte el archivo o enlace del alumno (pestaña «Conexión y exportación»).</span></div>`;}
function vRanking(L){if(!L.length)return vacio();return `<div class="overflow-x-auto"><table class="tabla"><thead><tr><th>Lugar</th><th>Expedicionario</th><th>Diagnóstico</th><th>Progreso por día</th><th>Puntaje</th><th>⭐</th><th>⚡ Energía</th><th>Errores</th><th>Tiempo</th><th>Estado</th></tr></thead><tbody>
 ${L.map((r,i)=>`<tr><td class="text-xl font-extrabold text-center">${medalla(i)}</td><td><div class="flex items-center gap-2">${avatarSVG(r.avatar,28)}<div><div class="font-extrabold">${esc(r.nombre)}</div><div class="text-xs opacity-60 font-semibold">${esc(r.grupo)} ${(AVATARES[r.avatar]||{}).n||''}</div></div></div></td><td class="font-bold">${r.diagResp>=3?r.diag+'/3':'<span class="opacity-50">en curso</span>'}</td><td style="white-space:nowrap">${progresoDias(r)}</td><td class="text-xl font-extrabold">${r.puntaje||0}</td><td class="font-bold">${r.estrellas||0}</td><td class="font-bold">${r.energia||0}</td><td class="font-bold">${r.errores||0}</td><td class="font-mono font-bold">${fmtT(r.tiempo)}</td><td>${r.estado==='finalizado'?`<span class="punto p-ok" style="width:auto;padding:0 .5rem">${r.final==='legendario'?'✨ Legendario':'🚁 Rescatado'}</span>`:'<span class="punto p-act" style="width:auto;padding:0 .5rem">en curso</span>'}</td></tr>`).join('')}
 </tbody></table></div><div class="text-xs font-semibold opacity-60 mt-2">Orden: puntaje (con multiplicador de racha) → finalizados primero → menor tiempo. ★ = día resuelto al primer intento · ✓ = resuelto con errores. Se actualiza automáticamente.</div>`;}
function vCotejo(L){if(!L.length)return vacio();return `<div class="flex flex-wrap justify-between items-center gap-2 mb-3"><p class="text-sm font-semibold opacity-75 m-0">Marca los criterios observados. Cada criterio vale 2.5 puntos (escala de 10). «Sugerir» propone una marca a partir del desempeño registrado; puedes ajustarla.</p><button class="btn btn-sec btn-mini" onclick="ISLA.sugerirTodos()">✨ Sugerir para todos los finalizados</button></div>
 <div class="overflow-x-auto"><table class="tabla"><thead><tr><th>Alumno</th>${CRIT.map((c,i)=>`<th>C${i+1}. ${c}</th>`).join('')}<th>Calificación</th><th>Errores detectados</th><th></th></tr></thead><tbody>
 ${L.map(r=>{const c=cotejoDe(r.id);return `<tr><td><div class="font-extrabold">${esc(r.nombre)}</div><div class="text-xs opacity-60">${esc(r.grupo)} · ${r.retos||0}/4 retos</div></td>${c.map((v,i)=>`<td class="text-center"><input type="checkbox" style="width:22px;height:22px;accent-color:#db2777" ${v?'checked':''} onchange="ISLA.marcar('${esc(r.id)}',${i},this.checked)"></td>`).join('')}<td class="text-xl font-extrabold text-center">${calif(r.id)}</td><td class="text-xs font-semibold" style="max-width:260px">${r.erroresDetalle.length?r.erroresDetalle.map(esc).join('<br>'):'<span class="opacity-50">Sin errores</span>'}</td><td><button class="btn btn-sec btn-mini" onclick="ISLA.sugerir('${esc(r.id)}')">Sugerir</button></td></tr>`;}).join('')}
 </tbody></table></div>`;}
function vAutoDoc(L){const A2=L.filter(r=>r.autoeval&&r.autoeval.n);if(!A2.length)return `<div class="text-center py-10 font-bold opacity-60">Todavía no se reciben autoevaluaciones.</div>`;
 const prom=AUTO.map((q,i)=>{const v=A2.map(r=>r.autoeval.n[i]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;});
 return `<div class="grid sm:grid-cols-4 gap-3 mb-5">${AUTO.map((q,i)=>`<div class="bg-white rounded-2xl p-3 border" style="border-color:#eadcc0"><div class="text-xs font-bold opacity-70">${q}</div><div class="barra mt-2" style="background:#f1ece2"><i style="width:${Math.round(prom[i]/2*100)}%"></i></div><div class="text-xs font-extrabold mt-1">Promedio: ${(prom[i]/2*100).toFixed(0)}% de dominio percibido</div></div>`).join('')}</div>
 <div class="grid md:grid-cols-2 gap-3">${A2.map(r=>`<div class="bg-white rounded-2xl p-4 border" style="border-color:#eadcc0"><div class="flex items-center gap-2 mb-2">${avatarSVG(r.avatar,26)}<b>${esc(r.nombre)}</b><span class="text-xs opacity-60">${esc(r.grupo)}</span></div>${AUTO.map((q,i)=>`<div class="text-sm flex justify-between gap-2 border-b border-dashed py-1" style="border-color:#eadcc0"><span>${q}</span><b style="white-space:nowrap">${NIVELES[r.autoeval.n[i]]||'—'}</b></div>`).join('')}${r.autoeval.c?`<div class="text-sm mt-2 p-2 rounded-xl" style="background:#fdf6e9">💬 ${esc(r.autoeval.c)}</div>`:''}</div>`).join('')}</div>`;}
function linkAlumno(){const base=location.href.split('?')[0].split('#')[0];return FB?base+'?fb='+encodeURIComponent(FB):base;}
function vConfig(){return `<div class="grid md:grid-cols-2 gap-5">
 <div><h3 class="text-xl font-extrabold mb-2">☁️ Conexión en la nube (Firebase)</h3>
  <p class="text-sm font-semibold opacity-75 mb-2">Sin Firebase, los resultados solo se ven en este mismo navegador. Para recibirlos a distancia, pega la URL de tu <b>Firebase Realtime Database</b>.</p>
  <input id="fb-url" class="campo mb-2" placeholder="https://tu-proyecto-default-rtdb.firebaseio.com" value="${esc(FB)}">
  <div class="flex flex-wrap gap-2 mb-3"><button class="btn btn-prim btn-mini" onclick="ISLA.guardarFb()">Guardar y probar conexión</button>${FB?'<button class="btn btn-sec btn-mini" onclick="ISLA.quitarFb()">Desconectar</button>':''}</div>
  <div class="text-sm font-bold mb-3">${FB?(DOC.estadoFb||'Probando…'):'Sin conexión configurada.'}</div>
  <div class="font-extrabold text-sm mb-1">🔗 Enlace directo para los alumnos</div>
  <div class="flex gap-2"><input class="campo text-sm" readonly value="${esc(linkAlumno())}" id="link-al"><button class="btn btn-sec btn-mini" onclick="ISLA.copiar()">Copiar</button></div>
  <p class="text-xs font-semibold opacity-70 mt-1">El enlace funciona cuando el archivo está publicado en internet (GitHub Pages, Netlify Drop, Google Sites…). Si lo compartes como archivo, usa la descarga de la derecha: ya incluye la conexión.</p>
  <details class="mt-3 text-sm"><summary class="font-extrabold cursor-pointer">¿Cómo crear la base de datos? (5 min)</summary><ol class="list-decimal pl-5 mt-2 font-semibold opacity-85 grid gap-1"><li>Entra a console.firebase.google.com y crea un proyecto gratuito.</li><li>Menú <i>Compilación → Realtime Database → Crear base de datos</i>.</li><li>En <i>Reglas</i>, pega y publica:<pre class="bg-white p-2 rounded-lg text-xs mt-1 overflow-x-auto">{ "rules": { "isla_poligono": { ".read": true, ".write": true } } }</pre></li><li>Copia la URL que aparece arriba de los datos y pégala aquí.</li></ol><p class="mt-2 text-xs opacity-70">Estas reglas son abiertas: úsalas solo durante la actividad y bórralas al terminar.</p></details>
 </div>
 <div><h3 class="text-xl font-extrabold mb-2">📦 Archivos separados</h3>
  <p class="text-sm font-semibold opacity-75 mb-3">Descarga dos aplicaciones independientes. La del alumno no contiene ningún acceso visible al panel ni a los rankings.</p>
  <div class="grid gap-2 mb-5"><button class="btn btn-prim justify-start" onclick="ISLA.bajar('alumno')">🧭 alumno_isla_poligono.html</button><button class="btn btn-sec justify-start" onclick="ISLA.bajar('docente')">🗼 docente_rankings.html</button></div>
  <h3 class="text-xl font-extrabold mb-2">📊 Exportar resultados</h3>
  <div class="grid gap-2 mb-5"><button class="btn btn-sec justify-start" onclick="ISLA.exportar('csv')">📄 Descargar CSV</button><button class="btn btn-sec justify-start" onclick="ISLA.exportar('xls')">📗 Descargar Excel (.xls)</button></div>
  <h3 class="text-xl font-extrabold mb-2">🧹 Reiniciar actividad</h3>
  <div class="flex flex-wrap gap-2"><button class="btn btn-sec btn-mini" onclick="ISLA.borrarLocal()">Borrar datos de este dispositivo</button>${FB?'<button class="btn btn-sec btn-mini" style="color:#b91c1c" onclick="ISLA.borrarFb()">Borrar datos en Firebase</button>':''}</div>
 </div></div>`;}
function vProyeccion(L,pct,totE,meta){return `<div class="proyeccion"><div class="max-w-6xl mx-auto"><div class="flex flex-wrap justify-between items-center gap-3 mb-5"><h1 class="text-4xl sm:text-5xl font-extrabold">🏆 Pizarrón de Supervivientes</h1><button class="btn btn-sec" onclick="ISLA.proyectar(false)">Salir ✕</button></div>
 <div class="mb-6"><div class="flex justify-between text-lg font-extrabold mb-2"><span>📡 Señal de Rescate Cooperativa</span><span>${pct}%</span></div><div class="barra" style="height:26px"><i style="width:${pct}%"></i></div></div>
 <table class="tabla"><thead><tr><th>Lugar</th><th>Expedicionario</th><th>Progreso</th><th>Puntaje</th><th>⭐</th><th>Tiempo</th></tr></thead><tbody>${L.slice(0,30).map((r,i)=>`<tr style="${i<3?'font-size:1.15em':''}"><td class="text-3xl text-center">${medalla(i)}</td><td class="font-extrabold">${esc(r.nombre)} ${r.estado==='finalizado'?'🚁':''}</td><td style="white-space:nowrap">${progresoDias(r)}</td><td class="text-3xl font-extrabold">${r.puntaje||0}</td><td>${r.estrellas||0}</td><td class="font-mono">${fmtT(r.tiempo)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center">Esperando expedicionarios…</td></tr>'}</tbody></table></div></div>`;}

function filas(){const L=alumnosTodos();const cab=['Lugar','Nombre','Grado/Grupo','Rol','Diagnóstico previo (/3)','Día 1','Día 2','Día 3','Día 4','Retos (/4)','Puntaje','Estrellas','Energía','Errores','Errores detectados','Tiempo','Estado','Final'].concat(CRIT.map((c,i)=>'C'+(i+1)+' '+c),['Calificación lista de cotejo (/10)'],AUTO.map((a,i)=>'Autoevaluación '+(i+1)),['Comentario del alumno']);
 const rows=L.map((r,i)=>{const c=cotejoDe(r.id);return [i+1,r.nombre,r.grupo,(AVATARES[r.avatar]||{}).n||'',r.diagResp>=3?r.diag:'',...[0,1,2,3].map(k=>{const d=r.dias[k];return d&&d.c?(d.primer?'Correcto al 1er intento':'Correcto en '+d.intentos+' intentos')+' (variante '+d.variante+')':'Pendiente';}),r.retos||0,r.puntaje||0,r.estrellas||0,r.energia||0,r.errores||0,r.erroresDetalle.join(' | '),fmtT(r.tiempo),r.estado,r.final==='legendario'?'Rescate Legendario':r.final==='limite'?'Rescate al Límite':'',...c.map(v=>v?'Sí':'No'),calif(r.id),...AUTO.map((a,k)=>r.autoeval&&r.autoeval.n?(NIVELES[r.autoeval.n[k]]||'').replace(/^\S+\s/,''):''),r.autoeval?r.autoeval.c:''];});return [cab].concat(rows);}
async function cargarFb(){if(!FB){DOC.estadoFb='';return;}const a=await fbGet('alumnos');if(a===undefined){DOC.estadoFb='⚠️ Sin conexión con Firebase';return;}DOC.fb=a||{};DOC.estadoFb='☁️ Firebase en vivo';}
async function cargarCotejoFb(){if(!FB)return;const c=await fbGet('cotejo');if(c&&typeof c==='object'){for(const id in c)if(Array.isArray(c[id]))DOC.cot[id]=c[id];LS.set('isla_cotejo',DOC.cot);}}
function refrescarDoc(){const a=document.activeElement;if(a&&(a.id==='fb-url'))return;renderDocente();}
const D={
 tab(t){DOC.tab=t;renderDocente();},
 proyectar(v){DOC.proy=v;renderDocente();try{if(v&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(!v&&document.fullscreenElement)document.exitFullscreen();}catch(e){}},
 marcar(id,i,v){const c=cotejoDe(id).slice();c[i]=v;DOC.cot[id]=c;LS.set('isla_cotejo',DOC.cot);fbPut('cotejo/'+id,c);renderDocente();},
 sugerir(id,silencio){const r=alumnosTodos().find(x=>x.id===id);if(!r)return;const d=r.dias;const e=k=>d[k]?d[k].errores:0;const c=[!!(d[0]&&d[0].c&&e(0)===0),[1,2,3].every(k=>d[k]&&d[k].c)&&(e(1)+e(2)+e(3))<=1,[1,2,3].every(k=>d[k]&&d[k].c)&&(e(1)+e(2)+e(3))<=3,(r.retos||0)===4&&d.filter(x=>x&&x.primer).length>=3];DOC.cot[id]=c;LS.set('isla_cotejo',DOC.cot);fbPut('cotejo/'+id,c);if(!silencio)renderDocente();},
 sugerirTodos(){alumnosTodos().filter(r=>r.estado==='finalizado').forEach(r=>D.sugerir(r.id,true));renderDocente();toast('✨ Sugerencias aplicadas');},
 async guardarFb(){FB=normFb($('#fb-url').value);LS.set('isla_fb',FB);DOC.estadoFb='Probando…';renderDocente();if(!FB)return;const t=await fbGet('');DOC.estadoFb=t===undefined?'⚠️ No se pudo conectar: revisa la URL y las reglas':'✅ Conectado a Firebase';await cargarFb();await cargarCotejoFb();if(t!==undefined)DOC.estadoFb='✅ Conectado a Firebase';renderDocente();},
 quitarFb(){FB='';LS.set('isla_fb','');DOC.fb={};DOC.estadoFb='';renderDocente();},
 copiar(){const v=$('#link-al').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('🔗 Enlace copiado'),()=>{$('#link-al').select();document.execCommand('copy');toast('🔗 Enlace copiado');});},
 bajar(modo){const doc=new DOMParser().parseFromString(SNAP,'text/html');doc.querySelectorAll('style:not(#estilos)').forEach(s=>s.remove());doc.getElementById('cfg').textContent='window.ISLA_CONFIG='+JSON.stringify({modo,fb:FB})+';';doc.getElementById('app').innerHTML='';doc.body.className='atm-0';
  descargar(modo==='alumno'?'alumno_isla_poligono.html':'docente_rankings.html','<!DOCTYPE html>\n'+doc.documentElement.outerHTML);toast(FB?'📦 Descargado (con conexión a Firebase)':'📦 Descargado (sin Firebase: solo datos locales)');},
 exportar(t){const F=filas();const fecha=new Date().toISOString().slice(0,10);
  if(t==='csv'){const csv='\uFEFF'+F.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');descargar('isla_poligono_resultados_'+fecha+'.csv',csv,'text/csv;charset=utf-8');}
  else{const h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1">'+F.map((r,i)=>'<tr>'+r.map(v=>(i?'<td>':'<th style="background:#fde68a">')+esc(v)+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></body></html>';descargar('isla_poligono_resultados_'+fecha+'.xls',h,'application/vnd.ms-excel');}},
 borrarLocal(){if(!confirm('¿Borrar todos los resultados guardados en ESTE dispositivo? No afecta a Firebase.'))return;LS.del('isla_alumnos');LS.del('isla_cotejo');DOC.cot={};renderDocente();},
 async borrarFb(){if(!confirm('¿Borrar TODOS los resultados de la actividad en Firebase? Esta acción no se puede deshacer.'))return;try{await fetch(FB+'/isla_poligono.json',{method:'DELETE'});DOC.fb={};toast('🧹 Datos de Firebase borrados');}catch(e){toast('No se pudo borrar');}renderDocente();}
};

/* ====================== ARRANQUE ====================== */
window.ISLA=Object.assign({},MODO==='docente'?D:A);
if(MODO==='docente'){
 renderDocente();
 if(bc)bc.onmessage=()=>refrescarDoc();
 window.addEventListener('storage',e=>{if(e.key==='isla_alumnos'||e.key==='isla_cotejo'){DOC.cot=LS.get('isla_cotejo',{});refrescarDoc();}});
 (async()=>{await cargarFb();await cargarCotejoFb();refrescarDoc();})();
 setInterval(async()=>{if(FB){await cargarFb();}refrescarDoc();},4000);
}else{
 if(S&&S.fase==='mision'&&S.modal&&S.dia>3)S.modal=null;
 if(S&&!S.fase)S.fase='prologo';
 renderAlumno();
 setInterval(()=>{const c=$('#crono');if(c&&S)c.textContent=fmtT((S.fin||Date.now())-S.inicio);},1000);
 setInterval(()=>{if(S&&['mision','final'].includes(S.fase))refrescarCoop();},8000);
 if(bc)bc.onmessage=()=>{if(S&&['mision','final'].includes(S.fase))refrescarCoop();};
 document.addEventListener('keydown',e=>{if(e.key==='Escape')A.cajon(false);});
}
})();
